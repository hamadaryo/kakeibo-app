{% extends "base.html" %}

{% block title %}編集 - 簡単お小遣い帳{% endblock %}

{% block content %}
    <div class="card">
        <h3 style="margin-top:0; font-size:16px; border-bottom: 1px solid #eee; padding-bottom: 8px;">記録を修正する</h3>
        
        <form action="/edit/{{ expense.id }}" method="POST" style="margin-top: 15px;">
            <div class="form-group">
                <label class="form-label">日付</label>
                <input type="date" name="date" value="{{ expense.date }}" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">カテゴリ</label>
                <input type="text" name="category" value="{{ expense.category }}" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">金額（円）</label>
                <input type="number" name="amount" value="{{ expense.amount }}" class="form-input" required>
            </div>
            
            <button type="submit" class="btn-primary">更新する</button>
        </form>
    </div>
{% endblock %}
