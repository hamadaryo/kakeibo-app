{% extends "base.html" %}

{% block title %}入力 - 簡単お小遣い帳{% endblock %}

{% block content %}
    <div class="card">
        <h3 style="margin-top:0; font-size:16px; border-bottom: 1px solid #eee; padding-bottom: 8px;">支出を入力する</h3>
        
        <form action="/add" method="POST" style="margin-top: 15px;">
            <div class="form-group">
                <label class="form-label">日付</label>
                <input type="date" name="date" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">カテゴリ（項目）</label>
                <input type="text" name="category" placeholder="例: 食費、日用品、交通費" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">金額（円）</label>
                <input type="number" name="amount" placeholder="例: 1200" class="form-input" required>
            </div>
            
            <button type="submit" class="btn-primary">保存する</button>
        </form>
    </div>
{% endblock %}
